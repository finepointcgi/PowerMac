[workspace]
resolver = "2"
members = ["crates/pm-input", "crates/mwb", "crates/fancyzones", "crates/awake", "crates/scroll-reverser", "crates/mouse-utils", "crates/keyboard-manager", "crates/pm-config", "crates/settings-ui", "crates/powermac"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
