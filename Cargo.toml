[workspace]
resolver = "2"
members = [
    "crates/pm-hook",
    "crates/pm-input",
    "crates/mwb",
    "crates/fancyzones",
    "crates/awake",
    "crates/scroll-reverser",
    "crates/mouse-utils",
    "crates/keyboard-manager",
    "crates/pm-config",
    "crates/settings-ui",
    "crates/pm-ui",
    "crates/mouse-tuning",
    "crates/display-control",
    "crates/clipboard-history",
    "crates/notch-shelf",
    "crates/pm-nowplaying",
    "crates/color-picker",
    "crates/text-extractor",
    "crates/file-tools",
    "crates/window-switcher",
    "crates/display-scaling",
    "crates/menubar-manager",
    "crates/audio-control",
    "crates/battery-limit",
    "crates/pm-audio-driver",
    "crates/dock-previews",
    "crates/text-expander",
    "crates/workspaces",
    "crates/net-monitor",
    "crates/gestures",
    "crates/pm-update",
    "crates/powermac",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
