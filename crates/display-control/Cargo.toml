[package]
name = "display-control"
version.workspace = true
edition.workspace = true

[dependencies]
pm-hook = { path = "../pm-hook" }
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
pm-input = { path = "../pm-input" }

# macOS: IOKit / CoreGraphics / CoreFoundation are bound by hand in
# src/platform/macos/ffi.rs; the private IOAVService, DisplayServices and
# CoreDisplay entry points are resolved at run time with dlsym.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_ColorSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
env_logger = "0.11"
