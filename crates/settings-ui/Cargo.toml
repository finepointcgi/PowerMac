[package]
name = "settings-ui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
pm-config = { path = "../pm-config" }
mwb = { path = "../mwb" }
fancyzones = { path = "../fancyzones" }
awake = { path = "../awake" }
scroll-reverser = { path = "../scroll-reverser" }
mouse-utils = { path = "../mouse-utils" }
keyboard-manager = { path = "../keyboard-manager" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3"
