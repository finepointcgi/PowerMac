[package]
name = "settings-ui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
pm-config = { path = "../pm-config" }
pm-ui = { path = "../pm-ui" }
mwb = { path = "../mwb" }
fancyzones = { path = "../fancyzones" }
awake = { path = "../awake" }
scroll-reverser = { path = "../scroll-reverser" }
mouse-utils = { path = "../mouse-utils" }
keyboard-manager = { path = "../keyboard-manager" }
mouse-tuning = { path = "../mouse-tuning" }
display-control = { path = "../display-control" }
clipboard-history = { path = "../clipboard-history" }
notch-shelf = { path = "../notch-shelf" }
color-picker = { path = "../color-picker" }
text-extractor = { path = "../text-extractor" }
file-tools = { path = "../file-tools" }
window-switcher = { path = "../window-switcher" }
display-scaling = { path = "../display-scaling" }
audio-control = { path = "../audio-control" }
dock-previews = { path = "../dock-previews" }
text-expander = { path = "../text-expander" }
menubar-manager = { path = "../menubar-manager" }
workspaces = { path = "../workspaces" }
pm-update = { path = "../pm-update" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "clipboard", "links"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
