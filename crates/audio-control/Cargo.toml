[package]
name = "audio-control"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

# macOS: CoreAudio is bound by hand in src/macos/ffi.rs. The process-tap entry
# points (macOS 14.2+) and the private TCC preflight are resolved with dlsym so
# the binary still loads on older systems. CATapDescription is driven through
# the Objective-C runtime.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
env_logger = "0.11"
